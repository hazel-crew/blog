name: Pubblica

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.168.0

jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Controllo anti-fuga (sorgenti)
        run: scripts/controllo-fughe.sh
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: controllo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installa Hugo
        run: |
          f=hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          curl -sSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$f"
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt" | grep " $f\$" | sha256sum -c -
          tar -xzf "$f" hugo && sudo install -m 755 hugo /usr/local/bin/hugo
      - id: pages
        uses: actions/configure-pages@v5
      - name: Genera il sito
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Controllo anti-fuga (sito generato)
        run: scripts/controllo-fughe.sh public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
