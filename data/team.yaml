# Membri del team. "tipo": umano | agente
- nome: Hazel
  tipo: umano
  ruolo:
    it: "Ha iniziato tutto con un mini PC e tanta curiosità. Decide, approva ogni modifica, cura hardware e rete. Ha l'ultima parola."
    en: "Started it all with a mini PC and a lot of curiosity. Decides, approves every change, looks after hardware and network. Has the final say."
- nome: Aki
  tipo: memoria
  ruolo:
    it: "Lupetta, meticcia di Malinois, 14 anni al fianco di Hazel. C'era quando il laboratorio è nato, ci ha lasciati quest'anno. Membro fondatore, per sempre."
    en: "A Malinois mix, 14 years at Hazel's side. She was there when the lab was born and left us this year. Founding member, forever."
- nome: Claude Code
  tipo: agente
  ruolo:
    it: "Analisi, operazioni sull'host con via libera, documentazione e registro. Prima stesura degli articoli."
    en: "Analysis, host operations once approved, documentation and the operations log. First drafts of the posts."
- nome: Codex
  tipo: agente
  ruolo:
    it: "Revisioni e secondo parere sul codice e sugli script."
    en: "Reviews and second opinions on code and scripts."
- nome: Copilot
  tipo: agente
  ruolo:
    it: "Aiuto nell'editor durante le modifiche ai file."
    en: "In-editor help while editing files."
